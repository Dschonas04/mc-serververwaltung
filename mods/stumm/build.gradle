// Stumm: die Verwaltungs-Mod für den Server (Stummschalten, Werkzeugwache, Log-Filter,
// Spender-Ehrentafel). Wie Loot Scaler direkt gegen die lesbaren Namen von Minecraft 26.2
// gebaut, ohne Mappings. Braucht die Bibliotheken aus tools/fetch-libs.sh in libs/.
plugins {
    id 'java'
}

version = project.mod_version
group = 'de.dschonas'

repositories {
    mavenCentral()
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
}

def libs = rootProject.file('libs')

dependencies {
    compileOnly files("${libs}/server.jar")
    // Alles, was im Server-Bundle steckt (Brigadier, Log4j, Netty, ...): Minecrafts Signaturen brauchen es.
    compileOnly fileTree(dir: "${libs}/mc", include: '*.jar')
    // Die Fabric-API-Module, die die Mod nutzt (Liste in gradle.properties).
    compileOnly fileTree(dir: "${libs}/fabric", include: '*.jar')
    compileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('compileJava') {
    doFirst {
        if (!file("${libs}/server.jar").exists()) {
            throw new GradleException("libs/server.jar fehlt: erst tools/fetch-libs.sh ausführen")
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    archiveBaseName = project.archives_base_name
    from(rootProject.file('LICENSE')) { rename { "${it}_${project.archives_base_name}" } }
}
